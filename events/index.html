<style>
@font-face{font-family:'BasierSquare';src:url('/Basier_Square/BasierSquare-Regular.otf') format('opentype');font-weight:400;font-display:swap;}
@font-face{font-family:'BasierSquare';src:url('/Basier_Square/BasierSquare-Medium.otf') format('opentype');font-weight:500;font-display:swap;}
@font-face{font-family:'BasierSquare';src:url('/Basier_Square/BasierSquare-SemiBold.otf') format('opentype');font-weight:600;font-display:swap;}
@font-face{font-family:'BasierSquare';src:url('/Basier_Square/BasierSquare-Bold.otf') format('opentype');font-weight:700;font-display:swap;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--cream:#F2EDE3;--cream2:#E8E0D0;--cream3:#D6CCBA;--charcoal:#1A1917;--charcoal2:#242220;--charcoal3:#2E2C28;--charcoal4:#3E3B35;--gold:#C8952A;--gold-lt:#E8B84B;--gold-dk:#9A6E18;--rust:#8B3A2A;--nav-h:64px;}
html{scroll-behavior:smooth;}
body{background:var(--charcoal);color:var(--cream);font-family:'BasierSquare',-apple-system,'Helvetica Neue',Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
a{color:inherit;}
nav{position:sticky;top:0;z-index:50;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,48px);background:rgba(26,25,23,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--charcoal3);}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
.brand img:first-child{height:28px;width:auto;}
.brand img:last-child{height:16px;width:auto;}
.nav-back{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--cream2);text-decoration:none;}
.nav-back:hover{color:var(--gold-lt);}
main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(16px,4vw,48px);}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);}
.ev{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(24px,4vw,56px);align-items:start;}
.ev-flyer{position:sticky;top:calc(var(--nav-h) + 24px);border-radius:6px;overflow:hidden;border:1px solid var(--charcoal4);background:var(--charcoal2);box-shadow:0 24px 60px rgba(0,0,0,.45);}
.ev-flyer img{display:block;width:100%;height:auto;}
.flyer-btn{position:relative;display:block;width:100%;padding:0;margin:0;border:0;background:none;font:inherit;color:inherit;cursor:zoom-in;}
.zoom-hint{display:block;padding:9px 0;background:var(--charcoal2);color:var(--cream3);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-align:center;border-top:1px solid var(--charcoal3);}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(10,10,9,.94);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out;}
.lightbox.on{display:flex;}
.lightbox img{max-width:100%;max-height:100%;width:auto;height:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.lightbox-close{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:1px solid var(--charcoal4);background:var(--charcoal2);color:var(--cream);font-size:24px;line-height:1;cursor:pointer;}
.ev-title{font-size:clamp(30px,4.6vw,52px);font-weight:700;line-height:1.05;letter-spacing:-.01em;margin:10px 0 14px;}
.ev-tagline{font-size:clamp(16px,1.6vw,19px);color:var(--cream2);margin-bottom:24px;}
.ev-facts{display:grid;gap:14px;padding:20px 0;border-top:1px solid var(--charcoal3);border-bottom:1px solid var(--charcoal3);margin-bottom:24px;}
.fact{display:flex;gap:14px;align-items:flex-start;}
.fact svg{flex-shrink:0;margin-top:2px;color:var(--gold);}
.fact b{display:block;font-weight:600;}
.fact span{color:var(--cream3);font-size:14px;}
.fact a.sub{color:var(--gold-lt);font-size:13px;font-weight:600;text-decoration:none;}
.countdown{display:flex;gap:10px;margin-bottom:24px;}
.cd{background:var(--charcoal2);border:1px solid var(--charcoal3);border-radius:4px;padding:10px 0;min-width:64px;text-align:center;}
.cd b{display:block;font-size:24px;font-weight:700;color:var(--gold-lt);font-variant-numeric:tabular-nums;}
.cd small{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--cream3);}
.live-tag{display:inline-block;background:var(--rust);color:var(--cream);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;border-radius:3px;margin-bottom:24px;}
.ctas{display:grid;gap:10px;margin-bottom:14px;}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 20px;border-radius:4px;font:inherit;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;cursor:pointer;text-align:center;border:1px solid transparent;transition:background .2s,border-color .2s,color .2s;}
.btn-gold{background:var(--gold);color:var(--charcoal);}
.btn-gold:hover{background:var(--gold-lt);}
.btn-line{background:transparent;color:var(--cream);border-color:var(--charcoal4);}
.btn-line:hover{border-color:var(--gold);color:var(--gold-lt);}
.btn-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.btn-row.three{grid-template-columns:repeat(3,minmax(0,1fr));}
.tiers{display:grid;gap:10px;margin:8px 0 24px;}
.tier{display:flex;justify-content:space-between;gap:16px;padding:14px 16px;background:var(--charcoal2);border:1px solid var(--charcoal3);border-radius:4px;}
.tier b{font-weight:600;}
.tier p{color:var(--cream3);font-size:13px;margin-top:2px;}
.tier .price{font-weight:700;color:var(--gold-lt);white-space:nowrap;}
h3{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--cream3);margin:28px 0 10px;}
.ev-desc p{color:var(--cream2);margin-bottom:12px;white-space:pre-line;}
.ev-desc h4{font-size:15px;font-weight:700;color:var(--gold-lt);margin:22px 0 8px;}
.ev-desc ul{list-style:none;margin-bottom:12px;}
.ev-desc li{position:relative;padding-left:20px;color:var(--cream2);margin-bottom:6px;}
.ev-desc li::before{content:'';position:absolute;left:2px;top:.62em;width:7px;height:7px;background:var(--gold);transform:rotate(45deg);}
.ev-desc p.warn{font-weight:700;color:var(--cream);letter-spacing:.06em;}
.fine{font-size:12px;color:var(--cream3);margin-top:20px;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--cream);color:var(--charcoal);font-size:14px;font-weight:600;padding:10px 18px;border-radius:4px;opacity:0;pointer-events:none;transition:all .25s;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.more{margin-top:56px;}
.more-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.more-card{display:block;text-decoration:none;background:var(--charcoal2);border:1px solid var(--charcoal3);border-radius:4px;padding:16px;}
.more-card:hover{border-color:var(--gold);}
.more-card small{color:var(--gold);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11px;}
.more-card b{display:block;margin-top:4px;}
.empty{max-width:560px;margin:8vh auto;text-align:center;}
.empty h1{font-size:clamp(30px,4.6vw,46px);font-weight:700;margin:12px 0;}
.empty p{color:var(--cream2);margin-bottom:28px;}
.empty .btn-row{max-width:440px;margin:0 auto;}
footer{border-top:1px solid var(--charcoal3);padding:24px clamp(16px,4vw,48px);font-size:12px;color:var(--cream3);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;}
footer a{color:var(--cream3);text-decoration:none;}
footer a:hover{color:var(--gold-lt);}
.loading{min-height:50vh;}
@media (max-width:820px){
  .ev{grid-template-columns:1fr;}
  .ev-flyer{position:relative;top:auto;max-width:520px;margin:0 auto;width:100%;}
  .cd{flex:1;min-width:0;}
  .btn-row.three .btn{font-size:11px;letter-spacing:.06em;padding:0 8px;text-align:center;}
}
</style>

<script>
(function(){
'use strict';
var SITE = 'https://www.throttledspirits.com';
var root = document.getElementById('ev-root');
document.getElementById('yr').textContent = new Date().getFullYear();

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
// http(s) URLs, or site-relative paths only; anything else becomes ''
function safeHref(u){
  var s = String(u == null ? '' : u).trim();
  if (/^https?:\/\//i.test(s)) return esc(s);
  if (/^\/(?!\/)/.test(s)) return esc(s);
  return '';
}
function track(name, params){
  try { if (typeof gtag === 'function') gtag('event', name, params || {}); } catch(e){}
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); }, 2200);
}

var ICON = {
  cal:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  pin:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  id:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="12" r="2"/><path d="M14 10h4M14 14h4"/></svg>'
};

function fmtDate(d, tz){
  return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric', timeZone: tz || undefined });
}
function fmtTime(d, tz){
  return d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', timeZone: tz || undefined, timeZoneName:'short' });
}
function icsStamp(d){ return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''); }
function icsText(s){ return String(s || '').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,'\\$&'); }
function eventUrl(ev){ return SITE + '/events/?e=' + encodeURIComponent(ev.id); }
function fullAddress(ev){ return [ev.venue, ev.address].filter(Boolean).join(', '); }

function gcalLink(ev, s, e){
  var p = new URLSearchParams({
    action:'TEMPLATE', text: ev.title,
    dates: icsStamp(s) + '/' + icsStamp(e),
    details: (ev.tagline ? ev.tagline + '\n\n' : '') + eventUrl(ev),
    location: fullAddress(ev)
  });
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}
function downloadIcs(ev, s, e){
  var lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//THROTTLED//Events//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT',
    'UID:' + icsText(ev.id) + '@throttledspirits.com',
    'DTSTAMP:' + icsStamp(new Date()),
    'DTSTART:' + icsStamp(s), 'DTEND:' + icsStamp(e),
    'SUMMARY:' + icsText(ev.title),
    'LOCATION:' + icsText(fullAddress(ev)),
    'DESCRIPTION:' + icsText((ev.tagline ? ev.tagline + '\n\n' : '') + eventUrl(ev)),
    'URL:' + eventUrl(ev),
    'END:VEVENT','END:VCALENDAR'
  ];
  var blob = new Blob([lines.join('\r\n')], { type:'text/calendar;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = String(ev.id || 'throttled-event').replace(/[^a-z0-9-]/gi,'') + '.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

function addJsonLd(ev, s, e){
  var data = {
    '@context':'https://schema.org', '@type':'Event',
    name: ev.title, startDate: ev.start, endDate: ev.end,
    eventStatus:'https://schema.org/EventScheduled',
    eventAttendanceMode:'https://schema.org/OfflineEventAttendanceMode',
    description: ev.tagline || '',
    url: eventUrl(ev),
    location: { '@type':'Place', name: ev.venue || '', address: ev.address || '' },
    organizer: { '@type':'Organization', name:'THROTTLED™', url: SITE },
    typicalAgeRange: '21-'
  };
  if (ev.flyer) data.image = [ /^https?:/i.test(ev.flyer) ? ev.flyer : SITE + ev.flyer ];
  if (ev.links && ev.links.tickets) {
    data.offers = (ev.tiers && ev.tiers.length ? ev.tiers : [{ price: 0 }]).map(function(t){
      return { '@type':'Offer', name: t.name || 'Admission', price: String(t.price || 0).replace(/[^0-9.]/g,'') || '0', priceCurrency:'USD', url: ev.links.tickets, availability:'https://schema.org/InStock' };
    });
  }
  var sc = document.createElement('script');
  sc.type = 'application/ld+json';
  sc.textContent = JSON.stringify(data).replace(/</g,'\\u003c');
  document.head.appendChild(sc);
}

var lb = document.getElementById('lightbox'), lbImg = document.getElementById('lightbox-img');
function openLightbox(img){
  if (!img) return;
  lbImg.src = img.src; lbImg.alt = img.alt;
  lb.classList.add('on'); document.body.style.overflow = 'hidden';
  lb.querySelector('.lightbox-close').focus();
}
function closeLightbox(){ lb.classList.remove('on'); document.body.style.overflow = ''; }
lb.addEventListener('click', closeLightbox);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && lb.classList.contains('on')) closeLightbox(); });

var cdTimer = null;
function startCountdown(s){
  var el = document.getElementById('cd');
  if (!el) return;
  function tick(){
    var ms = s - Date.now();
    if (ms <= 0) { el.outerHTML = '<div class="live-tag">Happening now</div>'; clearInterval(cdTimer); return; }
    var d = Math.floor(ms/864e5), h = Math.floor(ms/36e5)%24, m = Math.floor(ms/6e4)%60, sec = Math.floor(ms/1e3)%60;
    el.innerHTML = [[d,'Days'],[h,'Hrs'],[m,'Min'],[sec,'Sec']].map(function(p){
      return '<div class="cd"><b>' + (p[0] < 10 ? '0' : '') + p[0] + '</b><small>' + p[1] + '</small></div>';
    }).join('');
  }
  tick(); cdTimer = setInterval(tick, 1000);
}

function renderEmpty(){
  document.title = 'Events — THROTTLED™ Whiskey';
  root.className = '';
  root.innerHTML =
    '<div class="empty">' +
      '<div class="eyebrow">THROTTLED™ Events</div>' +
      '<h1>No upcoming events right now</h1>' +
      '<p>Tastings, releases and car-culture meetups get announced to The Barrel Inventory first. Join it and you\u2019ll hear about the next one before it hits social.</p>' +
      '<div class="btn-row">' +
        '<a class="btn btn-gold" href="/#inventory">Join The Barrel Inventory</a>' +
        '<a class="btn btn-line" href="/">Explore The Whiskey</a>' +
      '</div>' +
    '</div>';
  track('event_page_view', { event_id: 'none', state: 'empty' });
}

function renderEvent(ev, others){
  var s = new Date(ev.start), e = new Date(ev.end), tz = ev.timezone || undefined;
  var L = ev.links || {};
  var tickets = safeHref(L.tickets), fb = safeHref(L.facebook), ig = safeHref(L.instagram), flyer = safeHref(ev.flyer);
  var mapsHref = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(fullAddress(ev));
  var sameDay = fmtDate(s, tz) === fmtDate(e, tz);
  var when = sameDay ? fmtTime(s, tz).replace(/ [A-Z]{2,4}$/,'') + ' \u2013 ' + fmtTime(e, tz)
                     : fmtTime(s, tz) + ' through ' + fmtDate(e, tz);
  var live = Date.now() >= s.getTime();

  document.title = ev.title + ' — THROTTLED™ Events';

  var tiersHtml = (ev.tiers || []).map(function(t){
    return '<div class="tier"><div><b>' + esc(t.name) + '</b>' + (t.note ? '<p>' + esc(t.note) + '</p>' : '') + '</div><div class="price">' + esc(t.price) + '</div></div>';
  }).join('');
  // description: blank line = new block; "## " = subheading; lines starting "- " = bullet list
  var descHtml = String(ev.description || '').split(/\n{2,}/).filter(Boolean).map(function(block){
    var lines = block.split('\n').filter(Boolean);
    if (/^## /.test(lines[0])) return '<h4>' + esc(lines[0].slice(3)) + '</h4>';
    if (lines.every(function(l){ return /^- /.test(l); })) return '<ul>' + lines.map(function(l){ return '<li>' + esc(l.slice(2)) + '</li>'; }).join('') + '</ul>';
    return '<p' + (block === block.toUpperCase() && /[A-Z]/.test(block) ? ' class="warn"' : '') + '>' + esc(block) + '</p>';
  }).join('');

  var ext = ' target="_blank" rel="noopener noreferrer"';
  var html =
    '<article class="ev">' +
      (flyer ? '<div class="ev-flyer"><button type="button" class="flyer-btn js-zoom" aria-label="Expand flyer"><img src="' + flyer + '" alt="' + esc(ev.title) + ' event flyer" width="1080" height="1350"><span class="zoom-hint">&#x2922; Tap to expand flyer</span></button></div>' : '<div></div>') +
      '<div>' +
        '<div class="eyebrow">' + esc(ev.eyebrow || 'THROTTLED™ Presents') + '</div>' +
        '<h1 class="ev-title">' + esc(ev.title) + '</h1>' +
        (ev.tagline ? '<p class="ev-tagline">' + esc(ev.tagline) + '</p>' : '') +
        (live ? '<div class="live-tag">Happening now</div>' : '<div class="countdown" id="cd"></div>') +
        '<div class="ev-facts">' +
          '<div class="fact">' + ICON.cal + '<div><b>' + esc(fmtDate(s, tz)) + '</b><span>' + esc(when) + '</span></div></div>' +
          '<div class="fact">' + ICON.pin + '<div><b>' + esc(ev.venue) + '</b><span>' + esc(ev.address) + '</span><br><a class="sub js-dir" href="' + esc(mapsHref) + '"' + ext + '>Get directions &rarr;</a></div></div>' +
          '<div class="fact">' + ICON.id + '<div><b>' + esc(ev.age || '21+ with valid ID') + '</b>' + (ev.note ? '<span>' + esc(ev.note) + '</span>' : '') + '</div></div>' +
        '</div>' +
        '<div class="ctas">' +
          (tickets ? '<a class="btn btn-gold js-out" data-platform="eventbrite" href="' + tickets + '"' + ext + '>' + esc(L.ticketsLabel || 'Get Tickets') + '</a>' : '') +
          '<div class="btn-row">' +
            (fb ? '<a class="btn btn-line js-out" data-platform="facebook" href="' + fb + '"' + ext + '>RSVP on Facebook</a>' : '') +
            (ig ? '<a class="btn btn-line js-out" data-platform="instagram" href="' + ig + '"' + ext + '>See it on Instagram</a>' : '') +
          '</div>' +
          '<div class="btn-row three">' +
            '<a class="btn btn-line js-gcal" href="' + esc(gcalLink(ev, s, e)) + '"' + ext + '>Google Calendar</a>' +
            '<button type="button" class="btn btn-line js-ics">Apple / Outlook</button>' +
            '<button type="button" class="btn btn-line js-share">Share</button>' +
          '</div>' +
        '</div>' +
        (tiersHtml ? '<h3>Tickets</h3><div class="tiers">' + tiersHtml + '</div>' : '') +
        (descHtml ? '<h3>About the event</h3><div class="ev-desc">' + descHtml + '</div>' : '') +
        '<p class="fine">' + esc(ev.fine || 'Must be 21 or older to attend. Please enjoy responsibly and plan a safe ride home.') + '</p>' +
      '</div>' +
    '</article>';

  if (others.length) {
    html += '<section class="more"><h3>More upcoming events</h3><div class="more-grid">' +
      others.map(function(o){
        return '<a class="more-card" href="/events/?e=' + encodeURIComponent(o.id) + '"><small>' + esc(fmtDate(new Date(o.start), o.timezone)) + '</small><b>' + esc(o.title) + '</b><span style="color:var(--cream3);font-size:13px;">' + esc(o.venue) + '</span></a>';
      }).join('') + '</div></section>';
  }

  root.className = '';
  root.innerHTML = html;
  if (!live) startCountdown(s.getTime());
  addJsonLd(ev, s, e);

  root.addEventListener('click', function(evt){
    var t = evt.target.closest('a,button');
    if (!t) return;
    if (t.classList.contains('js-zoom')) { openLightbox(t.querySelector('img')); track('event_flyer_expand', { event_id: ev.id }); }
    else if (t.classList.contains('js-out')) track('event_ticket_click', { event_id: ev.id, platform: t.getAttribute('data-platform') });
    else if (t.classList.contains('js-dir')) track('event_directions', { event_id: ev.id });
    else if (t.classList.contains('js-gcal')) track('event_add_calendar', { event_id: ev.id, method: 'google' });
    else if (t.classList.contains('js-ics')) { downloadIcs(ev, s, e); track('event_add_calendar', { event_id: ev.id, method: 'ics' }); }
    else if (t.classList.contains('js-share')) {
      var url = eventUrl(ev);
      if (navigator.share) {
        navigator.share({ title: ev.title, text: ev.tagline || ev.title, url: url }).then(function(){ track('event_share', { event_id: ev.id, method: 'native' }); }).catch(function(){});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(function(){ toast('Link copied'); track('event_share', { event_id: ev.id, method: 'copy' }); });
      }
    }
  });

  var params = new URLSearchParams(location.search);
  track('event_page_view', {
    event_id: ev.id,
    state: live ? 'live' : 'upcoming',
    utm_source: params.get('utm_source') || '(none)'
  });
}

fetch('/events/events.json?t=' + Date.now(), { cache:'no-store' })
  .then(function(r){ return r.ok ? r.json() : { events: [] }; })
  .catch(function(){ return { events: [] }; })
  .then(function(data){
    var now = Date.now();
    var list = (data && Array.isArray(data.events) ? data.events : [])
      .filter(function(ev){ return ev && ev.id && ev.title && ev.start && ev.end && !ev.hidden && new Date(ev.end).getTime() > now; })
      .sort(function(a,b){ return new Date(a.start) - new Date(b.start); });
    if (!list.length) return renderEmpty();
    var want = new URLSearchParams(location.search).get('e');
    var pick = list.filter(function(ev){ return ev.id === want; })[0] || list[0];
    renderEvent(pick, list.filter(function(ev){ return ev !== pick; }));
  });
})();
</script>
</body>
</html>
